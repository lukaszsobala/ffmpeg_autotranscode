# autotranscode in a container. Copy .env.example to .env and fill it in, then:
#
#   docker compose build
#   docker compose run --rm autotranscode doctor
#   docker compose run --rm autotranscode run /path/to/library
#
# For hardware decoding (scene cuts, grain, verify), add the file for your machine:
#
#   docker compose -f compose.yaml -f compose.vaapi.yaml ...    Intel or AMD GPU
#   docker compose -f compose.yaml -f compose.rk3588.yaml ...   RK3588 board (this
#                                     also lets machine.profile = "auto" see it)
#
# See "Docker" in the README.

services:
  autotranscode:
    build: .
    image: autotranscode:local
    # Files come out owned by you rather than by root. Docker Desktop on a Mac
    # maps ownership to your account whatever this says.
    user: "${UID:-1000}:${GID:-1000}"
    # autotranscode turns SIGTERM into a checkpoint: Av1an finishes winding down
    # and the ledger is left for a rerun. Give it time before the SIGKILL.
    stop_grace_period: 2m
    environment:
      # Log times in local time rather than the container's UTC.
      TZ: ${TZ:-UTC}
    volumes:
      - ${CONFIG_DIR:?set CONFIG_DIR in .env}:/config
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
      # The library at the same path as on the host, so paths in the config, the
      # logs and the reports mean the same thing inside and out.
      - ${LIBRARY:?set LIBRARY in .env}:${LIBRARY}
