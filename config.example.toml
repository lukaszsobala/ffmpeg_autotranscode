# autotranscode configuration.
#
# Every value below is a default; delete anything you do not want to change.
# Start from a machine profile, then override only what differs.
#
#   autotranscode -c ~/.config/autotranscode.toml doctor
#   autotranscode -c ~/.config/autotranscode.toml measure /media/films/*.mkv
#   autotranscode -c ~/.config/autotranscode.toml run /media/films

[machine]
# "auto"        rk3588 on an RK3588 board, generic anywhere else.
# "rk3588"      Rockchip boards. No AV1 hardware encoder exists, so SVT-AV1 runs on
#               the CPU; defaults to preset 4 / crf 30 / 1 worker.
# "workstation" many fast cores; preset 4 / crf 28.
# "generic"     conservative middle ground.
# The preset and crf set under [encode] below win over any profile's.
profile = "auto"

# Av1an parallel workers. 0 lets Av1an choose from core count.
#
# On RK3588 use 1. The binding constraint is memory, not cores: at 4K 10-bit a
# single SVT-AV1 instance is already several GB, and two of them drive a 16 GB
# board into swap, while one worker already keeps the cores busy. The rk3588
# profile sets 1 and the others leave it to Av1an, so this stays commented out
# unless you want to override that.
# workers = 1

# Scheduling priority, so an unattended crawl leaves the board usable.
nice = 10

[paths]
# Leave as "ffmpeg"/"ffprobe" to auto-detect jellyfin-ffmpeg in its usual locations
# before falling back to PATH. jellyfin-ffmpeg is strongly preferred: it ships
# libvmaf and rkmpp/rkrga, which distribution builds generally do not.
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
av1an = "av1an"
# The standalone SVT-AV1 encoder binary, which Av1an drives directly. A source
# build installs it under the prefix you chose (~/.local/bin by default), which
# is not always on PATH -- give the full path here if `doctor` cannot find it.
svtav1encapp = "SvtAv1EncApp"
grav1synth = "grav1synth"
mkvmerge = "mkvmerge"

# Scratch space. The grain analysis writes short lossless excerpts here, which are
# large for their duration; allow a few GiB (more for 4K).
work_dir = "~/.cache/autotranscode"
state_file = "~/.cache/autotranscode/state.json"

[encode]
preset = 4          # SVT-AV1 preset, -1 (slowest) .. 13. Each step is ~1.5-2.2x speed.
crf = 30            # 1..70. Lower is higher quality and bigger. This is the
                    # value for a 4K source; crf_by_width shifts it elsewhere.
pix_format = "yuv420p10le"   # 10-bit even from 8-bit sources: cheap, and avoids banding.
tune = 0            # 0 = VQ (subjective quality), 2 = SSIM. Use 0 for watching.
variance_boost_curve = "auto" # "auto" uses SVT-AV1's PQ curve (2) for HDR10, else 0.
keyint_sec = 10.0   # Keyframe interval in seconds.

# "hybrid" is the right choice here. lsmash/ffms2/bestsource are more accurate but
# each needs its own VapourSynth *plugin* (L-SMASH-Works, ffms2, BestSource).
#
# Note that the bootstrap script does install VapourSynth, so `doctor` will report
# `vapoursynth yes` -- but only because Av1an refuses to link without it, not
# because any source plugin is present. `doctor` cannot tell the difference, so if
# you switch away from "hybrid", install the matching plugin yourself first.
chunk_method = "hybrid"
concat = "mkvmerge"          # mkvmerge avoids ffmpeg's occasional audio-seek breakage.
sc_method = "standard"       # "fast" is cheaper but cuts scenes worse.
extra_split_sec = 10
min_scene_len = 24

# Anything extra handed straight to SvtAv1EncApp, e.g. ["--enable-overlays", "1"].
extra_svt_params = []

# CRF is a quality target per coded pixel, and it is not resolution-neutral: a
# pixel at 576p is magnified far more on the same screen than one at 2160p, so a
# single CRF across a mixed library makes the small files look the worst. These
# are shifts applied to `crf` above, keyed by the smallest width in each band.
# Delete the table to encode everything at one CRF.
#
# Keyed by width, with slack, because a scope film is cropped to its picture: a
# 4K print can be 3840x1600 or 3836x2072, and keying on height would file it as
# 1080p and under-encode it. Cropping removes bars top and bottom, not the sides.
# A picture narrower than 16:9 goes by its height instead (1440x1080 4:3 HD is
# 1080p, 960x720 is 720p), and non-square pixels by their shown width.
[encode.crf_by_width]
3000 = 0            # 4K. crf 30 with variance boost: the highest free of blocks on 4K HDR.
1700 = 7            # 1080p: 37, and only because of the dark bias below. Without it,
                    # a grainy 1080p film blocked in a dark scene even at 32.
1100 = -3           # 720p
0 = -6              # 576p and below

# The next two take either one number for everything or a table like the one
# above, where a source gets the value of the band it falls in.

# Variance boost: 0 off, 1-4 on. Spends more bits on flat areas. The only setting
# that removed blocking in fog and flat areas on a grainy 4K HDR film; more bits
# alone did not. Below 4K it lost every test: the same size, a worse picture.
[encode.variance_boost_strength]
3000 = 2
0 = 0

# Dark bias, 0-100: a lower QP for dark frames, the darker the lower. It fixed
# shadows smearing into blocks on a grainy 1080p film where more bits and variance
# boost did not, and 100 with a higher CRF cost less than 25 or 50 with a lower
# one. It acts on whole frames, so a dim film pays for it on most of them.
[encode.luminance_qp_bias]
3000 = 0
1700 = 100
1100 = 0

# ac-bias, 0-8, keeps texture and grain from flattening; tf strength, 0-4 or -1
# for the encoder's own default (3), is how hard SVT-AV1 averages neighbouring
# frames. On a grainy 4K film, variance boost alone left the fog blotched: grain
# averaged into patches tens of pixels across. ac-bias 1 with strength 1 cleared
# it where CRF 26 and stronger variance boost did not, for 1.17x the size of the
# film without them. Turning the filter off scored higher still but looked worse
# in motion. Not yet tried below 4K.
[encode.ac_bias]
3000 = 1.0
0 = 0.0

[encode.tf_strength]
3000 = 1
0 = -1

# Sampling for `estimate`, which ranks a library by what a real encode would save.
[estimate]
samples = 0          # excerpts per file. 0 scales with runtime, within the bounds below.
min_samples = 3
max_samples = 6
sample_seconds = 10
# Probe grain first, so a grainy film is estimated on the denoise + grain-synthesis
# route it would really take. Costs a few seconds per file and changes the answer
# most on the files where the savings are largest.
grain_probe = true

[target_quality]
# Let Av1an search per-chunk for the CRF that hits a quality score. Much more
# consistent than a fixed CRF, but multiplies encode time by the probe count.
# On RK3588 this is usually not worth it; leave it off and tune crf instead.
enabled = false
metric = "vmaf"              # vmaf | ssimulacra2 | butteraugli-inf | xpsnr
score = 94.0
min_q = 18
max_q = 48
probes = 4
probing_speed = "veryfast"

[grain]
# "auto"   measure each file and take the grain route only when it is grainy
# "always" force the grain route
# "never"  plain encode, no denoising and no synthesis
mode = "auto"

# "sampled" analyses a few short excerpts (fast, modest disk use).
# "full" analyses the entire film: more faithful, but needs lossless scratch space
# proportional to the whole runtime. Expect tens of GiB.
analysis = "sampled"
samples = 4
sample_seconds = 2

denoise_filter = "hqdn3d"
denoise_strength = "auto"    # "auto" picks from the measured score; or set e.g. "hqdn3d=1.4:1.0:6:6"

# Mean PSNR in dB between a file and a reference-denoised copy of itself. Lower means
# more grain. Files scoring BELOW this take the denoise + grain-synthesis route.
#
# CALIBRATE THIS. The default came from synthetic test patterns, which score higher
# than real footage. Run `autotranscode measure` over a handful of titles you know to
# be clean and a handful you know to be grainy, and put the threshold between them.
threshold_db = 44.0

keep_table = true            # keep the generated .tbl next to the work dir for inspection

[staging]
# Copy each source to local storage before reading it, and work from the copy.
#
# An encode reads its source many times over many hours: scene detection, every
# chunk, the grain samples, the final mux. If the library lives on a NAS or a
# spinning disk, that is hours of constant activity and the drive never idles.
#
# Both directions are staged. Reads come from the local copy, and the finished
# file is written locally too, moving to its destination only once it has passed
# the output.min_saving_percent check -- writing straight into a folder on that
# disk would keep it busy just as reading did. The net effect is one read at the
# start, one write at the end, and an idle disk in between.
#
# Worth turning on when the library is on different (slower) storage than
# paths.work_dir. Pointless when they are the same device.
enabled = false

# Where to put the copies. Empty means <work_dir>/staging. Point this at fast
# local storage with room for your largest single file.
directory = ""

# Refuse to stage unless this multiple of the source size is free. It covers the
# copy itself plus the encoded output, which is staged alongside it and is
# normally a small fraction of the source. Staging is only an optimisation: when
# there is not enough room, or the copy fails, the file is read and written in
# place instead and the run continues.
min_free_multiple = 1.5

# Leave the copy behind afterwards. Only useful for debugging; a 4K remux is
# tens of GiB. An interrupted run keeps its copy regardless, and the next run
# reuses it if the size still matches.
keep = false

[dolby_vision]
# Dolby Vision carries an RPU alongside a base layer. The RPU cannot come with us:
# Av1an's chunked pipeline does not carry it through, and it would not survive the
# re-encode regardless. The base layer, however, usually can.
#
#   "base-layer"  encode the base layer, drop the RPU (default)
#   "skip"        leave every Dolby Vision title alone
#
# For profiles 7, 8.1, 8.2, 8.4 and 10.x the base layer is a complete, correctly
# tagged HDR10, HLG or SDR picture -- the same thing Jellyfin serves when it
# transcodes these titles on the fly. You lose the dynamic per-shot metadata and
# keep everything else, including the HDR10 static metadata below.
mode = "base-layer"

# Profile 5 is the exception: it has no cross-compatible base layer, so without the
# RPU it decodes to badly skewed colour.
#
#   "skip"         leave profile 5 titles alone (default)
#   "tonemap-sdr"  reshape them with ffmpeg's tonemapx filter, which reads the RPU
#                  on the CPU -- but only writes BT.709, so this converts an HDR
#                  master to SDR. A real downgrade, hence opt-in.
#
# There is no CPU path from profile 5 to HDR10. libplacebo could do it but needs a
# working Vulkan device, which the RK3588's Mali GPU does not provide.
profile5 = "skip"

# Tonemapping controls, used only by profile5 = "tonemap-sdr". Defaults match
# Jellyfin's. peak = 0 lets the filter detect the signal peak itself.
tonemap_algorithm = "bt2390"
tonemap_desat = 0.0
tonemap_peak = 0.0

[audio]
# "smart" copies already-efficient tracks and re-encodes wasteful ones (TrueHD, DTS,
# PCM) to Opus. "copy" never re-encodes. "opus" always re-encodes.
mode = "smart"
opus_kbps_per_channel = 64   # 5.1 -> 384k
passthrough_codecs = ["opus", "aac", "ac3", "eac3", "flac", "mp3"]
max_channels = 0             # 0 keeps the source layout; 2 forces a stereo downmix

[subtitles]
mode = "copy"                # copy | none | text-only (drops PGS/VobSub bitmaps)

[output]
suffix = ".av1"              # movie.mkv -> movie.av1.mkv
container = "mkv"
directory = ""               # empty writes next to the source
# Percent, not a fraction: 10.0 means "must be at least 10% smaller than the
# source". Below it the encode is deleted and the file recorded as skipped, on the
# grounds that a marginal saving is not worth a re-encode generation. Set 0.0 to
# keep every result.
min_saving_percent = 10.0
replace_source = false       # true deletes the original after a successful encode

[library]
extensions = [".mkv", ".mp4", ".m4v", ".avi", ".ts", ".mov", ".webm", ".wmv"]
skip_codecs = ["av1"]        # do not re-encode what is already AV1
min_duration_sec = 60.0      # ignore clips and samples

# Skip sources that are already efficient, measured in bits per pixel per second
# (bitrate / (width * height * fps)). Re-encoding these costs hours and saves
# little, and min_saving_percent only discovers that after the encode. For scale:
# a 4K HDR remux is ~0.15, a 1080p web release ~0.08, a good 4K AV1 encode ~0.01.
# Set 0 to check nothing. A source whose bitrate cannot be read is never skipped.
min_bits_per_pixel = 0.03
recursive = true
