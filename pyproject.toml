[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotranscode"
dynamic = ["version"]              # autotranscode.__version__
description = "AV1 library transcoder built on Av1an, SVT-AV1, grav1synth and jellyfin-ffmpeg"
readme = "README.md"
requires-python = ">=3.11"          # tomllib
license = "0BSD"
dependencies = []                    # stdlib only; the heavy lifting is external binaries

[project.scripts]
autotranscode = "autotranscode.cli:main"

[tool.setuptools]
packages = ["autotranscode"]

[tool.setuptools.dynamic]
version = { attr = "autotranscode.__version__" }

[tool.setuptools.package-data]
# The toolchain this version was tested with; see autotranscode/versions.py.
autotranscode = ["toolchain.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
# Read by Pylance as well as the pyright CLI, so both report the same things.
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
